services:
  - type: web
    name: washington-flipper
    env: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GA_MEASUREMENT_ID
        sync: false
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CRM_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: LEADS_NOTIFY_EMAIL
        sync: false
      - key: NEXT_PUBLIC_BRAND_NAME
        value: "KindKey Home Buyers"
      - key: NEXT_PUBLIC_BRAND_TAGLINE
        value: "Your Local Home Buyer in Kent & Federal Way"
      - key: NEXT_PUBLIC_PRIMARY_CITIES
        value: "Kent,Federal Way"
      - key: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
        sync: false
      - key: NEXT_PUBLIC_GA_MEASUREMENT_ID
        sync: false